name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run migrate

      - run: npm test

      - run: npm run test:integration

      - run: npm run build

      - name: Verify .env.example parses into a valid production config
        run: npm run check:env-example

      - name: Verify systemd unit files
        run: |
          sudo apt-get update -y
          sudo apt-get install -y systemd
          systemd-analyze verify --recursive-errors=no deploy/systemd/power-node.service

      - name: Shellcheck the backup script
        run: |
          sudo apt-get install -y shellcheck sqlite3
          shellcheck deploy/scripts/backup.sh

      - name: Exercise backup.sh against a real dev database
        run: |
          DB_PATH=/tmp/ci-backup-test/dev.sqlite
          DB_PATH="$DB_PATH" node dist/db/migrate.js
          ./deploy/scripts/backup.sh "$DB_PATH" /tmp/ci-backup-test/backups 2
          ls /tmp/ci-backup-test/backups/*.bak.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-node-01-dist
          path: |
            dist/
            public/
            db/migrations/
            package.json
            package-lock.json
          retention-days: 14
